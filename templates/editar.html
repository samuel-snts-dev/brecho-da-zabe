<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar peça</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topo topo-admin">
        <div class="logo">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
            <span>Painel</span>
        </div>
        <nav class="menu">
            <a href="/admin">Voltar</a>
            <a href="/sair">Sair</a>
        </nav>
    </header>

    <main class="painel">
        <h2>Editar peça</h2>

        <form method="POST" enctype="multipart/form-data" class="formulario">
            <label>Nome</label>
            <input type="text" name="nome" value="{{ peca.nome }}" required>

            <label>Tamanho</label>
            <input type="text" name="tamanho" value="{{ peca.tamanho }}" required>

            <label>Preço</label>
            <input type="text" name="preco" value="{{ '%.2f'|format(peca.preco)|replace('.', ',') }}" required>

            <label>Categoria</label>
            <select name="categoria" required>
                {% for cat in categorias %}
                    <option value="{{ cat }}" {% if peca.categoria == cat %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
            </select>

            <label>Fotos atuais (marque as que quer tirar)</label>
            <div class="previas">
                {% for foto in peca.fotos %}
                    <label class="foto-editar">
                        <img src="{{ url_for('static', filename='fotos/' + foto) }}" alt="{{ peca.nome }}" class="previa-mini">
                        <span>
                            <input type="checkbox" name="remover_fotos" value="{{ foto }}"> Remover
                        </span>
                    </label>
                {% endfor %}
            </div>

            <label>Adicionar mais fotos (opcional)</label>
            <input type="file" name="fotos" accept="image/*" multiple onchange="mostrarPrevias(this, 'previas-editar')">
            <div id="previas-editar" class="previas"></div>

            <button type="submit">Salvar alterações</button>
            <a href="/admin" class="link-cancelar">Cancelar</a>
        </form>
    </main>

    <script>
        // prévia de VÁRIAS imagens
        function mostrarPrevias(campo, idCaixa) {
            let caixa = document.getElementById(idCaixa);
            caixa.innerHTML = "";   // limpa as prévias antigas

            for (let arquivo of campo.files) {
                let imagem = document.createElement("img");
                imagem.src = URL.createObjectURL(arquivo);
                imagem.className = "previa-mini";
                caixa.appendChild(imagem);
            }
        }
    </script>
</body>
</html>
